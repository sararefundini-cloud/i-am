<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10110f"><title>I AM · Scripture Ripples</title>
  <link rel="stylesheet" href="game.css"><link rel="stylesheet" href="encounters.css">
  <script defer src="encounters.js"></script><script defer src="game.js"></script>
</head>
<body>
  <main id="entrance">
    <div class="brand"><i aria-hidden="true"></i> Scripture Ripples</div>
    <div class="title-block">
      <h1>I AM</h1>
      <blockquote>“How is it that ye do not understand?”<cite>Mark 8:21 · KJV excerpt</cite></blockquote>
      <div class="entrance-actions"><button class="primary" id="enter">Enter the hallway</button><button id="chapters">Choose a chapter</button></div>
    </div>
    <footer><span>A game by Sara</span><span class="control-legend"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> Move <kbd>Space</kbd> Act</span></footer>
  </main>
  <section id="play" hidden aria-label="Current chapter">
    <div class="playbar"><button id="rooms">Chapters</button><strong id="now-playing"></strong><button id="play-journal">Passage journal</button></div>
    <div id="stage"></div>
  </section>
  <button id="home-journal">Passage journal <span id="count"></span></button>
  <dialog id="panel"><div class="panel-head"><span class="brand small"><i aria-hidden="true"></i> I AM</span><button id="close" aria-label="Close panel">Close</button></div><div id="panel-body"></div></dialog>
</body></html>
