<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080706"><title>I AM · Scripture Ripples</title>
  <link rel="stylesheet" href="game.css"><link rel="stylesheet" href="encounters.css">
  <script defer src="shared-music.js"></script><script defer src="encounters.js"></script><script defer src="game.js"></script>
</head>
<body>
  <main id="entrance">
    <div class="intro-frame">
      <img src="assets/intro-screen.png" alt="I AM. How is it that ye do not understand? Mark 8:21, King James Version. A game by Sara Refundini.">
      <button type="button" id="enter" aria-label="Enter the hallway"></button>
      <button type="button" id="chapters" aria-label="Choose a chapter"></button>
      <button type="button" id="home-journal" aria-label="Passage journal"><span id="count"></span></button>
    </div>
    <button type="button" class="music-toggle" data-iam-music aria-pressed="true">Music ON</button>
  </main>
  <section id="play" hidden aria-label="Current chapter">
    <div class="playbar"><button id="rooms">Chapters</button><strong id="now-playing"></strong><button id="play-journal">Passage journal</button><button type="button" class="music-toggle" data-iam-music aria-pressed="true">Music ON</button></div>
    <div id="stage"></div>
  </section>
  <dialog id="panel"><div class="panel-head"><span class="brand small"><i aria-hidden="true"></i> I AM</span><button id="close" aria-label="Close panel">Close</button></div><div id="panel-body"></div></dialog>
</body></html>
